name: Run MESH TECH MD Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # youtube-dl-exec downloads a binary through the GitHub API during
        # postinstall; skipping lifecycle scripts avoids runner rate limits.
        run: npm ci --ignore-scripts

      - name: Check syntax
        run: |
          node --check index.js
          node --check server.js
          node --check media/menu.js
          node --check commands/menu.js

      - name: Start bot smoke test
        env:
          OWNER_NUMBER: ${{ secrets.OWNER_NUMBER }}
          OWNER_NAME: ${{ secrets.OWNER_NAME }}
          BOT_NAME: MESH TECH MD
          BOT_PREFIX: .
          TIMEZONE: Africa/Nairobi
          PORT: 3000
        run: |
          set +e
          timeout --signal=TERM 30s npm start
          exit_code=$?
          # A timeout means the process stayed running as expected.
          if [ "$exit_code" -ne 0 ] && [ "$exit_code" -ne 124 ] && [ "$exit_code" -ne 143 ]; then
            exit "$exit_code"
          fi
        
